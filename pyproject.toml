[project]
name = "agent-pipeline-poc"
version = "0.1.0"
description = "A vendor-agnostic POC of automated code, review, fix, CI and CD with coding agents"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
