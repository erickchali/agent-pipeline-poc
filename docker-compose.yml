# Local sandbox. Example:
#   docker compose run --rm sandbox python -m scripts.agent_run --agent fake code --task docs/starter-issues/01-delete-note.md
# The sandbox only gets test settings and the model API key. Never mount production credentials.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notes
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/notes
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT: ${AGENT:-claude}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/notes
    depends_on:
      db:
        condition: service_healthy
